name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate app project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_PATH="$(find . -maxdepth 6 -type f \( -name 'capacitor.config.ts' -o -name 'capacitor.config.json' -o -name 'capacitor.config.js' \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$CONFIG_PATH" ]; then
            echo "ERROR: capacitor.config.ts/json/js was not found. Make sure the complete game project is committed to this repository."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$CONFIG_PATH")"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json was not found beside $CONFIG_PATH."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/index.html" ]; then
            echo "ERROR: index.html was not found in $PROJECT_DIR. Check the project root."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path was not configured by setup-android."
            exit 1
          fi
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install project and Capacitor dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund \
            @capacitor/core@^8 \
            @capacitor/cli@^8 \
            @capacitor/android@^8 \
            @capacitor/status-bar@^8 \
            @capacitor/splash-screen@^8 \
            @capacitor/keyboard@^8

      - name: Remove obsolete Capacitor config option
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f capacitor.config.ts ]; then
            sed -i '/^[[:space:]]*bundledWebRuntime[[:space:]]*:/d' capacitor.config.ts
          fi

      - name: Build web app
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run build

      - name: Add Android platform if missing
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          elif [ ! -f android/gradlew ]; then
            echo "ERROR: An android/ directory exists, but android/gradlew is missing. Remove the incomplete android directory or restore the complete native Android project."
            exit 1
          else
            echo "Existing Android platform found."
          fi

      - name: Sync Capacitor Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK artifact
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Gradle finished, but the expected APK was not found at $APK_PATH."
            find android -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p output
          cp "$APK_PATH" output/lale-saga.apk
          ls -lh output/lale-saga.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lale-saga-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/output/lale-saga.apk
          if-no-files-found: error
          retention-days: 14
